<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUXORIS — Digital Execution Platform</title>
<style>
/* ─── RESET & BASE ─────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:Arial,sans-serif;font-size:8px;background:#f0f2f5;color:#1a1a2e}

/* ─── FONT HIERARCHY ───────────────────────────────────────── */
.h1{font-size:12px;font-weight:700;color:#1a1a2e}          /* Header */
.h2{font-size:9px;font-weight:700;color:#1a1a2e}           /* Sub-header */
.txt{font-size:8px;font-weight:400;color:#444}             /* Body text */
.txt-dim{font-size:8px;font-weight:400;color:#888}         /* Dim text */
.txt-mono{font-size:8px;font-family:Arial,sans-serif;color:#444}
.txt-bold{font-size:8px;font-weight:700}

/* ─── SCROLLBARS ───────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#d0d4dc;border-radius:2px}

/* ─── LAYOUT ───────────────────────────────────────────────── */
#app{display:flex;height:100vh}

/* ─── SIDEBAR ──────────────────────────────────────────────── */
#sidebar{
  width:190px;min-width:190px;background:#fff;
  border-right:1px solid #e2e6ea;display:flex;flex-direction:column;
  transition:width .22s ease,min-width .22s ease;
  overflow:hidden;flex-shrink:0;
}
#sidebar.collapsed{width:42px;min-width:42px}

.sidebar-logo{
  padding:10px 12px;border-bottom:1px solid #e2e6ea;
  display:flex;align-items:center;gap:8;overflow:hidden;
}
.logo-icon{
  width:26px;height:26px;border-radius:5px;flex-shrink:0;
  background:#1e3a8a;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:11px;font-weight:700;
}
.logo-text{overflow:hidden;white-space:nowrap}
.logo-title{font-size:12px;font-weight:700;color:#1e3a8a;letter-spacing:.5px;line-height:1}
.logo-sub{font-size:7px;color:#888;margin-top:2px;letter-spacing:.5px}

#nav{flex:1;overflow-y:auto;padding:6px 4px}
.nav-group{
  font-size:7px;font-weight:700;color:#bbb;letter-spacing:1.5px;
  padding:10px 8px 3px;text-transform:uppercase;white-space:nowrap;overflow:hidden
}
#sidebar.collapsed .nav-group{opacity:0;height:0;padding:0}

.nav-btn{
  width:100%;padding:6px 8px;background:transparent;
  border:1px solid transparent;border-radius:5px;
  cursor:pointer;display:flex;align-items:center;gap:7;
  margin-bottom:1px;transition:all .12s;white-space:nowrap;text-align:left;
}
#sidebar.collapsed .nav-btn{justify-content:center;padding:7px 0}
.nav-btn:hover{background:#f5f7fa}
.nav-btn.active{background:#eff4ff;border-color:#c7d7fd}
.nav-btn.active .nav-label{color:#1e3a8a;font-weight:700}
.nav-icon{font-size:11px;flex-shrink:0;width:14px;text-align:center}
.nav-label{font-size:8px;font-weight:500;color:#444;overflow:hidden;text-overflow:ellipsis}
.nav-id{font-size:7px;color:#aaa;margin-right:2px}
#sidebar.collapsed .nav-label,.nav-id-wrap{display:none}
#sidebar.collapsed .nav-label{display:none}

.sidebar-toggle{
  padding:8px;background:transparent;border:none;border-top:1px solid #e2e6ea;
  cursor:pointer;color:#aaa;font-size:9px;display:flex;
  align-items:center;justify-content:flex-end;padding-right:12px;transition:all .12s;
}
#sidebar.collapsed .sidebar-toggle{justify-content:center;padding-right:0}
.sidebar-toggle:hover{color:#666}

/* ─── MAIN ─────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ─── TOPBAR ───────────────────────────────────────────────── */
#topbar{
  background:#fff;border-bottom:1px solid #e2e6ea;
  padding:8px 16px;display:flex;align-items:center;gap:10;flex-shrink:0;
}
.topbar-left{flex:1;min-width:0}
.topbar-crumb{font-size:7px;color:#aaa;letter-spacing:1px;margin-bottom:2px;text-transform:uppercase}
.topbar-name{font-size:12px;font-weight:700;color:#1a1a2e;line-height:1}

.kpi-pill{
  background:#f8f9fb;border:1px solid #e2e6ea;border-radius:4px;
  padding:4px 10px;text-align:center;flex-shrink:0;
}
.kpi-pill-v{font-size:11px;font-weight:700;line-height:1}
.kpi-pill-l{font-size:7px;color:#888;margin-top:1px;text-transform:uppercase;letter-spacing:.5px}

.clock-box{background:#f8f9fb;border:1px solid #e2e6ea;border-radius:4px;padding:4px 10px;text-align:center;flex-shrink:0}
.clock-time{font-size:11px;font-weight:700;color:#1e3a8a;letter-spacing:1px;line-height:1}
.clock-date{font-size:7px;color:#888;margin-top:1px}

/* ─── MODULE TABS ──────────────────────────────────────────── */
#modtabs{
  background:#fff;border-bottom:1px solid #e2e6ea;
  padding:0 16px;display:flex;overflow-x:auto;flex-shrink:0;
}
#modtabs::-webkit-scrollbar{height:2px}
.mod-tab{
  padding:6px 11px;background:transparent;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  font-size:8px;font-weight:600;font-family:Arial,sans-serif;
  letter-spacing:.3px;white-space:nowrap;flex-shrink:0;
  transition:all .12s;color:#aaa;text-transform:uppercase;
}
.mod-tab.active{color:var(--tc,#1e3a8a);border-bottom-color:var(--tc,#1e3a8a)}
.mod-tab:hover:not(.active){color:#555;background:#f8f9fb}

/* ─── CONTENT ──────────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;padding:14px 16px;background:#f0f2f5}

/* ─── FOOTER ───────────────────────────────────────────────── */
#footer{
  background:#fff;border-top:1px solid #e2e6ea;
  padding:4px 16px;display:flex;justify-content:space-between;
  font-size:7px;color:#bbb;flex-shrink:0;letter-spacing:.3px;
}

/* ─── TOAST ────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:16px;right:16px;z-index:9999;
  background:#1e3a8a;border-radius:4px;padding:7px 14px;
  font-size:8px;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.15);
  opacity:0;transition:opacity .18s;pointer-events:none;
}
#toast.show{opacity:1}

/* ─── CARDS ────────────────────────────────────────────────── */
.card{
  background:#fff;border:1px solid #e2e6ea;border-radius:6px;
  padding:12px 14px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #f0f2f5;
}
.card-title{font-size:9px;font-weight:700;color:#1a1a2e;text-transform:uppercase;letter-spacing:.5px}

/* ─── STAT CARDS ───────────────────────────────────────────── */
.stat-card{
  background:#fff;border:1px solid #e2e6ea;border-radius:6px;
  padding:10px 12px;position:relative;overflow:hidden;
}
.stat-card-accent{
  position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--ac,#1e3a8a);
}
.stat-v{font-size:20px;font-weight:700;line-height:1;margin-bottom:3px}
.stat-l{font-size:7px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.8px}
.stat-sub{font-size:7px;color:#aaa;margin-top:4px}
.stat-delta{font-size:7px;font-weight:700;margin-top:2px}

/* ─── TABLES ───────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  font-size:7px;font-weight:700;color:#888;text-transform:uppercase;
  letter-spacing:.8px;padding:6px 8px;background:#f8f9fb;
  border-bottom:1px solid #e2e6ea;white-space:nowrap;text-align:center;
}
thead th.tl{text-align:left}
tbody td{
  font-size:8px;color:#333;padding:6px 8px;
  border-bottom:1px solid #f0f2f5;text-align:center;
}
tbody td.tl{text-align:left}
tbody tr:hover td{background:#fafbff}
tbody tr:last-child td{border-bottom:none}

/* ─── BADGE ────────────────────────────────────────────────── */
.badge{
  display:inline-block;padding:2px 6px;border-radius:3px;
  font-size:7px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  font-family:Arial,sans-serif;
}

/* ─── BAR ──────────────────────────────────────────────────── */
.bar-wrap{background:#f0f2f5;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width 1s ease}

/* ─── PROGRESS BAR ROW ─────────────────────────────────────── */
.prog-row{display:flex;align-items:center;gap:8;margin-bottom:7px}
.prog-label{font-size:8px;color:#333;width:88px;flex-shrink:0}
.prog-bar{flex:1}
.prog-val{font-size:8px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
.prog-delta{font-size:7px;font-weight:700;width:26px;text-align:right;flex-shrink:0}

/* ─── GRID HELPERS ─────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mb10{margin-bottom:10px}
.mb14{margin-bottom:10px}

/* ─── SECTION LABEL ────────────────────────────────────────── */
.sec-lbl{font-size:9px;font-weight:700;color:#1a1a2e;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}

/* ─── RING SVG LABEL ───────────────────────────────────────── */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.ring-lbl{font-size:7px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px}

/* ─── COMM CARD ────────────────────────────────────────────── */
.comm-card{background:#fff;border:1px solid #e2e6ea;border-radius:6px;padding:12px;border-top:3px solid var(--cc,#1e3a8a)}

/* ─── MP KPI ───────────────────────────────────────────────── */
.mp-kpi-row{display:flex;align-items:center;gap:6;margin-bottom:5px}
.mp-kpi-l{font-size:7px;font-weight:700;color:#888;width:38px;flex-shrink:0;text-transform:uppercase}
.mp-kpi-v{font-size:7px;font-weight:700;width:22px;text-align:right;flex-shrink:0}

/* ─── FADE IN ──────────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .2s ease}

/* ─── STATUS DOT ───────────────────────────────────────────── */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dot-live{animation:pulse 2s infinite}

/* ─── SEPARATOR ────────────────────────────────────────────── */
.sep{border:none;border-top:1px solid #f0f2f5;margin:8px 0}

/* ─── MATRIX CELL ──────────────────────────────────────────── */
.mx-cell{width:32px;height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">A</div>
      <div class="logo-text">
        <div class="logo-title">AUXORIS</div>
        <div class="logo-sub">v1.0 · 3SGT · EXECUTION</div>
      </div>
    </div>
    <div id="nav"></div>
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Collapse">&#9664;</button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <div class="topbar-crumb" id="crumb">AUXORIS · M00 · EXECUTIVE</div>
        <div class="topbar-name" id="modname">Command Center</div>
      </div>
      <div class="kpi-pill"><div class="kpi-pill-v" style="color:#1e3a8a">58.1%</div><div class="kpi-pill-l">Overall</div></div>
      <div class="kpi-pill"><div class="kpi-pill-v" style="color:#d97706">0.922</div><div class="kpi-pill-l">SPI</div></div>
      <div class="kpi-pill"><div class="kpi-pill-v" style="color:#0369a1">432</div><div class="kpi-pill-l">On Site</div></div>
      <div class="kpi-pill"><div class="kpi-pill-v" style="color:#dc2626">1</div><div class="kpi-pill-l">LTI</div></div>
      <div class="clock-box">
        <div class="clock-time" id="clock">00:00:00</div>
        <div class="clock-date" id="cdate"></div>
      </div>
    </div>

    <div id="modtabs"></div>
    <div id="content" class="fade-in"></div>

    <div id="footer">
      <span>AUXORIS PLATFORM &nbsp;·&nbsp; 11 MODULES &nbsp;·&nbsp; PROJECT 3SGT</span>
      <span>Sabah Energy Corp &nbsp;·&nbsp; AUXORIS Sdn Bhd &nbsp;·&nbsp; USD 485M EPCC</span>
    </div>
  </div>
</div>
<div id="toast"><span id="toast-msg"></span></div>

<script>
// ════════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════════
const PROJECT = {
  code:'3SGT', name:'LNG Train 3 — Sabah Gas Terminal',
  client:'Sabah Energy Corp', epc:'AUXORIS Sdn Bhd',
  budget:485000000, planned:'2026-06-30', forecast:'2026-09-15',
  overall:58.1, planned_pct:63.0, spi:0.922, cpi:0.961
};

const MODULES = [
  {id:'M00',code:'CMD', label:'Command Center', icon:'◈', color:'#1e3a8a', group:'EXECUTIVE'},
  {id:'M03',code:'LL',  label:'Line List',       icon:'≡', color:'#b45309', group:'ENGINEERING'},
  {id:'M06',code:'WLD', label:'Weld Tracker',    icon:'◎', color:'#c2410c', group:'CONSTRUCTION'},
  {id:'M08',code:'PRG', label:'Progress',        icon:'▦', color:'#047857', group:'CONSTRUCTION'},
  {id:'M09',code:'TP',  label:'Test Packs',      icon:'◉', color:'#0369a1', group:'TESTING'},
  {id:'M10',code:'MC',  label:'MC & Punch',      icon:'✓', color:'#7c3aed', group:'TESTING'},
  {id:'M11',code:'COM', label:'Commissioning',   icon:'⚡', color:'#065f46', group:'COMMISSIONING'},
  {id:'M12',code:'DOC', label:'Documents',       icon:'▤', color:'#92400e', group:'ENGINEERING'},
  {id:'M13',code:'HSE', label:'HSE',             icon:'⚠', color:'#dc2626', group:'SAFETY'},
  {id:'M14',code:'MP',  label:'Manpower',        icon:'◈', color:'#1d4ed8', group:'RESOURCES'},
  {id:'M15',code:'RPT', label:'Reports',         icon:'▣', color:'#6d28d9', group:'EXECUTIVE'},
];

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
let sidebarCollapsed = false;

function init() {
  buildNav(); buildTabs(); startClock(); setModule('M00');
}

function buildNav() {
  const nav = document.getElementById('nav');
  const groups = [...new Set(MODULES.map(m => m.group))];
  groups.forEach(grp => {
    const gDiv = document.createElement('div');
    gDiv.innerHTML = `<div class="nav-group">${grp}</div>`;
    MODULES.filter(m => m.group === grp).forEach(mod => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.id = `nav-${mod.id}`;
      btn.title = mod.label;
      btn.innerHTML = `<span class="nav-icon" style="color:${mod.color}">${mod.icon}</span>
        <span class="nav-label"><span class="nav-id">${mod.id !== 'M00' ? mod.id + ' ' : ''}</span>${mod.label}</span>`;
      btn.onclick = () => setModule(mod.id);
      gDiv.appendChild(btn);
    });
    nav.appendChild(gDiv);
  });
}

function buildTabs() {
  const tabs = document.getElementById('modtabs');
  MODULES.forEach(mod => {
    const btn = document.createElement('button');
    btn.className = 'mod-tab';
    btn.id = `tab-${mod.id}`;
    btn.style.setProperty('--tc', mod.color);
    btn.textContent = mod.code;
    btn.onclick = () => setModule(mod.id);
    tabs.appendChild(btn);
  });
}

function setModule(id) {
  const mod = MODULES.find(m => m.id === id);
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mod-tab').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById(`nav-${id}`);
  const tb = document.getElementById(`tab-${id}`);
  if (nb) nb.classList.add('active');
  if (tb) tb.classList.add('active');
  document.getElementById('crumb').textContent = `AUXORIS · ${id} · ${mod.group}`;
  document.getElementById('modname').textContent = mod.label;
  const content = document.getElementById('content');
  content.className = 'fade-in';
  content.innerHTML = RENDERERS[id] ? RENDERERS[id]() : `<div style="padding:40px;text-align:center;color:#aaa;font-size:8px">Loading ${id}…</div>`;
  content.offsetHeight;
  initBars();
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  const sb = document.getElementById('sidebar');
  const btn = sb.querySelector('.sidebar-toggle');
  sb.classList.toggle('collapsed', sidebarCollapsed);
  btn.innerHTML = sidebarCollapsed ? '&#9654;' : '&#9664;';
}

function startClock() {
  const tick = () => {
    const n = new Date();
    document.getElementById('clock').textContent = n.toLocaleTimeString('en-GB', {hour12: false});
    document.getElementById('cdate').textContent = n.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
  };
  tick(); setInterval(tick, 1000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function initBars() {
  setTimeout(() => {
    document.querySelectorAll('.bar-fill[data-pct]').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 40);
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function bar(pct, color, h = 5) {
  return `<div class="bar-wrap" style="height:${h}px">
    <div class="bar-fill" data-pct="${pct}" style="width:0%;height:${h}px;background:${color}"></div>
  </div>`;
}

function badge(text, color, bg) {
  bg = bg || color + '18';
  return `<span class="badge" style="background:${bg};color:${color}">${text}</span>`;
}

function sc(value, label, color, sub='', delta='', deltaOk=true) {
  return `<div class="stat-card">
    <div class="stat-card-accent" style="--ac:${color}"></div>
    <div class="stat-v" style="color:${color}">${value}</div>
    <div class="stat-l">${label}</div>
    ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
    ${delta ? `<div class="stat-delta" style="color:${deltaOk?'#16a34a':'#dc2626'}">${delta}</div>` : ''}
  </div>`;
}

function tblWrap(title, color, headers, rows) {
  const ths = headers.map(h => `<th class="${h.l ? (h.center === false ? 'tl' : '') : ''}">${h.l || h}</th>`).join('');
  return `<div class="card mb10" style="padding:0">
    <div style="padding:8px 12px;border-bottom:1px solid #f0f2f5;display:flex;align-items:center;gap:6">
      <div style="width:3px;height:14px;border-radius:2px;background:${color}"></div>
      <span class="card-title" style="color:${color}">${title}</span>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr>${ths}</tr></thead><tbody>${rows.join('')}</tbody></table>
    </div>
  </div>`;
}

function td(v, opts = {}) {
  const cls = opts.center === false ? 'tl' : '';
  const style = [
    opts.color ? `color:${opts.color}` : '',
    opts.bold ? 'font-weight:700' : '',
    opts.sz ? `font-size:${opts.sz}px` : '',
    opts.nowrap ? 'white-space:nowrap' : '',
  ].filter(Boolean).join(';');
  return `<td class="${cls}" style="${style}">${v}</td>`;
}

function drawSCurve(planned, actual, labels, W=520, H=140) {
  const P = {l:28,r:8,t:8,b:20};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const max = Math.max(...planned) + 3;
  const x = i => P.l + i / (planned.length - 1) * iw;
  const y = v => P.t + ih - v / max * ih;
  let grid = '';
  [20,40,60,80].forEach(g => {
    const yy = y(g);
    grid += `<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#e2e6ea" stroke-width="1"/>
    <text x="${P.l-3}" y="${yy+3}" text-anchor="end" fill="#bbb" font-size="6" font-family="Arial">${g}</text>`;
  });
  let xlbls = labels.map((l,i)=>`<text x="${x(i)}" y="${H-3}" text-anchor="middle" fill="#bbb" font-size="6" font-family="Arial">${l}</text>`).join('');
  const pp = planned.map((v,i)=>`${i===0?'M':'L'}${x(i)},${y(v)}`).join(' ');
  const af = `M${x(0)},${y(actual[0])} ` + actual.map((v,i)=>`L${x(i)},${y(v)}`).join(' ') + ` L${x(actual.length-1)},${H-P.b} L${P.l},${H-P.b} Z`;
  const ap = actual.map((v,i)=>`${i===0?'M':'L'}${x(i)},${y(v)}`).join(' ');
  const dots = actual.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#1e3a8a" stroke="#fff" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    ${grid}${xlbls}
    <path d="${af}" fill="#dbeafe" opacity=".6"/>
    <path d="${pp}" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
    <path d="${ap}" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function ring(pct, color, size=64, stroke=6, label='') {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ * (1 - pct / 100);
  return `<div class="ring-wrap">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e2e6ea" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"
        style="transition:stroke-dashoffset 1.2s ease"/>
      <text x="${size/2}" y="${size/2+1}" text-anchor="middle" dominant-baseline="middle"
        fill="${color}" font-size="${Math.round(size*.18)}" font-weight="700" font-family="Arial"
        style="transform:rotate(90deg);transform-origin:${size/2}px ${size/2}px">${pct}%</text>
    </svg>
    ${label ? `<div class="ring-lbl">${label}</div>` : ''}
  </div>`;
}
